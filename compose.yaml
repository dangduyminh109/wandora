services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.local}
    ports: ['127.0.0.1:7474:7474', '127.0.0.1:7687:7687']
    volumes: ['neo4j_data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.30
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  mongodb:
    image: mongo:8
    profiles: ['travel']
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo_data:/data/db']
  cassandra:
    image: cassandra:5
    profiles: ['analytics']
    ports: ['127.0.0.1:9042:9042']
    volumes: ['cassandra_data:/var/lib/cassandra']
    healthcheck:
      test: ['CMD-SHELL', "cqlsh -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
volumes:
  neo4j_data:
  redis_data:
  mongo_data:
  cassandra_data:
